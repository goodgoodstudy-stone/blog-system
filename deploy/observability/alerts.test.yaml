rule_files:
  - /etc/prometheus/alerts.yaml
evaluation_interval: 15s
tests:
  - name: internal JSON error fires critical rules
    interval: 15s
    input_series:
      - series: 'up{job="blog-api",instance="api:9090"}'
        values: '1+0x8'
      - series: 'blog_log_entries_total{job="blog-api",instance="api:9090",level="error",event="json_response_encode"}'
        values: '0+0x3 1+0x4'
    promql_expr_test:
      - expr: 'sum(ALERTS{alertname="BlogInternalJSONOrPanic",alertstate="firing",severity="critical"})'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'sum(ALERTS{alertname="BlogErrorLogs",alertstate="firing"})'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 1
  - name: downstream timeouts fire warning
    interval: 15s
    input_series:
      - series: 'up{job="blog-api",instance="api:9090"}'
        values: '1+0x8'
      - series: 'blog_log_entries_total{job="blog-api",instance="api:9090",level="warn",event="downstream_timeout"}'
        values: '0+0x3 4+0x4'
    promql_expr_test:
      - expr: 'sum(ALERTS{alertname="BlogDownstreamTimeouts",alertstate="firing",severity="warning"})'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'sum(ALERTS{alertname="BlogErrorLogs",alertstate="firing"}) or vector(0)'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 0
  - name: malformed client JSON does not trigger system error or warning burst
    interval: 15s
    input_series:
      - series: 'up{job="blog-api",instance="api:9090"}'
        values: '1+0x12'
      - series: 'blog_log_entries_total{job="blog-api",instance="api:9090",level="warn",event="invalid_request_json"}'
        values: '0+0x3 100+0x9'
    promql_expr_test:
      - expr: 'sum(ALERTS{alertname=~"BlogInternalJSONOrPanic|BlogErrorLogs|BlogWarningBurst",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 0
  - name: infrastructure warning burst must persist for one minute
    interval: 15s
    input_series:
      - series: 'up{job="blog-api",instance="api:9090"}'
        values: '1+0x12'
      - series: 'blog_log_entries_total{job="blog-api",instance="api:9090",level="warn",event="telemetry_export"}'
        values: '0+0x3 20+0x9'
    promql_expr_test:
      - expr: 'sum(ALERTS{alertname="BlogWarningBurst",alertstate="firing"}) or vector(0)'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'sum(ALERTS{alertname="BlogWarningBurst",alertstate="firing"})'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 1
