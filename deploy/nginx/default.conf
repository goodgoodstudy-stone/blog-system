server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 11m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
