name: blog-engineering-release

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  migrate:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-api:${IMAGE_TAG:?Set IMAGE_TAG}
    command: ["migrate"]
    environment: &api-env
      DB_DSN: blog:${MYSQL_PASSWORD}@tcp(mysql:3306)/blog?parseTime=true&loc=UTC
      UPLOAD_DIR: /data/uploads
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      ADDITIONAL_ORIGINS: ${ADDITIONAL_ORIGINS:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

  api:
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *api-env
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-} # Set alloy:4318 with the observability profile.
      TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-0.1}
      OBS_DEBUG_RAW: ${OBS_DEBUG_RAW:-true}
      METRICS_ADDR: :9090
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver", "--enable-feature=exemplar-storage"]
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks: [internal]

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [internal]

  loki:
    image: grafana/loki:3.5.0
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks: [internal]

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [observability]
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - ./deploy/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki, tempo, prometheus]
    networks: [internal]

  grafana:
    image: grafana/grafana:12.0.2
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-observability-only}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/blog-dashboards/api-overview.json
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/blog-system.yaml:ro
      - ./deploy/observability/dashboards:/etc/grafana/blog-dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
    networks: [internal]

volumes:
  mysql_data:
  uploads:
  prometheus_data:
  tempo_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  internal:
